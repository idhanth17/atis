# NSE equity segment trading holidays (weekday full-day closures).
# VERIFY every year against the official NSE circular:
#   https://www.nseindia.com/resources/exchange-communication-holidays
# The calendar module FAILS CLOSED: if a date's year is missing here,
# trading is refused (CalendarStaleError) rather than assumed open.
# Note: Muhurat trading (2026: Sun Nov 8) is deliberately NOT modelled —
# the automated system does not trade special sessions.

years:
  2026:
    - 2026-01-15  # Maharashtra municipal elections (special closure)
    - 2026-01-26  # Republic Day
    - 2026-03-03  # Holi
    - 2026-03-26  # Shri Ram Navami
    - 2026-03-31  # Shri Mahavir Jayanti
    - 2026-04-03  # Good Friday
    - 2026-04-14  # Dr. Ambedkar Jayanti
    - 2026-05-01  # Maharashtra Day
    - 2026-05-28  # Bakri Id
    - 2026-06-26  # Muharram
    - 2026-09-14  # Ganesh Chaturthi
    - 2026-10-02  # Mahatma Gandhi Jayanti
    - 2026-10-20  # Dussehra
    - 2026-11-10  # Diwali - Balipratipada
    - 2026-11-24  # Prakash Gurpurb Sri Guru Nanak Dev
    - 2026-12-25  # Christmas
