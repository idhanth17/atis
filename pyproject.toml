[project]
name = "atis"
version = "0.1.0"
description = "AI Trading Intelligence System (India) — free-first, safety-first"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "tzdata>=2024.1",  # IANA tz database — Windows has none; Asia/Kolkata must resolve
]

[project.optional-dependencies]
data = [
    "requests>=2.32",
    "yfinance>=0.2.40",
    "pandas>=2.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
atis = "atis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
